name: Release

# Triggered by pushing a version tag, e.g. `git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1`.
# The tag (without the leading `v`) becomes the app version and the GitHub Release name.
on:
  push:
    tags:
      - 'v*'

permissions:
  # Required for softprops/action-gh-release to create the release and upload assets.
  contents: write

jobs:
  release:
    # electron-builder must target Windows on a Windows runner to produce the NSIS installer.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Set package.json version so the installer's internal version and the
          # electron-builder output filename match the tag. Not committed.
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build and package
        run: yarn dist

      - name: Assemble release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $stem = "SpeechToText-$version"

          # Portable: rename the unpacked dir so the zip extracts into a named
          # folder, then compress the folder (keeps Speech to Text.exe + DLLs together).
          $portableDir = "dist/$stem-portable-win-x64"
          Rename-Item -Path "dist/win-unpacked" -NewName "$stem-portable-win-x64"
          $portableZip = "dist/$stem-portable-win-x64.zip"
          Compress-Archive -Path $portableDir -DestinationPath $portableZip -Force

          # Installer: electron-builder names it "Speech to Text Setup <version>.exe";
          # copy to a space-free, predictable download name.
          $installerSrc = Get-ChildItem -Path "dist" -Filter "*Setup*.exe" | Select-Object -First 1
          $installerOut = "dist/$stem-Setup.exe"
          Copy-Item -Path $installerSrc.FullName -Destination $installerOut -Force

          "portable=$portableZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer=$installerOut" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.value }}
          # alpha/beta tags (containing a hyphen, e.g. v0.1.0-alpha.1) are marked prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.portable }}
            ${{ steps.assets.outputs.installer }}
